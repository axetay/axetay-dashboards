<!doctype html>
<html lang="en" data-state="locked">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Status Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0f0d'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%2340f39a'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>

    <!-- Lock screen: the payload is encrypted, so nothing renders until the passphrase decrypts it. -->
    <section class="gate" id="gate">
      <form class="gate__panel" id="gate-form" autocomplete="off">
        <p class="gate__eyebrow">encrypted payload</p>
        <h1 class="gate__title">Status Board</h1>
        <p class="gate__hint">
          This page carries an AES-GCM blob. Decryption happens in your browser; the passphrase never leaves it.
        </p>
        <label class="gate__label" for="passphrase">Passphrase</label>
        <input
          class="gate__input"
          id="passphrase"
          name="passphrase"
          type="password"
          required
          autofocus
          spellcheck="false"
        />
        <label class="gate__remember">
          <input type="checkbox" id="remember" checked />
          <span>Remember on this device</span>
        </label>
        <button class="gate__button" type="submit" id="unlock">Decrypt</button>
        <p class="gate__error" id="gate-error" role="alert" hidden></p>
      </form>
    </section>

    <main class="board" id="board" hidden>
      <header class="board__head">
        <div class="board__identity">
          <span class="board__pulse" aria-hidden="true"></span>
          <h1 class="board__title">Status Board</h1>
        </div>
        <dl class="board__meta">
          <div>
            <dt>Snapshot</dt>
            <dd id="meta-generated">—</dd>
          </div>
          <div>
            <dt>Refresh</dt>
            <dd id="meta-refresh">—</dd>
          </div>
          <div>
            <dt>Failing</dt>
            <dd id="meta-failing">—</dd>
          </div>
        </dl>
        <button class="board__lock" id="lock" type="button">Lock</button>
      </header>

      <div class="legend" aria-hidden="true">
        <span class="legend__item" data-state="success">passing</span>
        <span class="legend__item" data-state="running">running</span>
        <span class="legend__item" data-state="failure">failing</span>
        <span class="legend__item" data-state="idle">idle</span>
        <span class="legend__item" data-state="absent">not wired</span>
      </div>

      <div class="rows" id="rows"></div>

      <footer class="board__foot">
        <span id="foot-note">Data refreshes on a schedule; the page re-reads it every minute.</span>
      </footer>
    </main>

    <template id="row-template">
      <section class="row">
        <header class="row__head">
          <h2 class="row__name"></h2>
          <a class="row__link" target="_blank" rel="noopener noreferrer">repo ↗</a>
        </header>
        <div class="row__tiles"></div>
      </section>
    </template>

    <template id="tile-template">
      <a class="tile" target="_blank" rel="noopener noreferrer">
        <span class="tile__glyph" aria-hidden="true"></span>
        <span class="tile__label"></span>
        <span class="tile__state"></span>
        <span class="tile__detail"></span>
        <span class="tile__foot"></span>
        <span class="tile__sweep" aria-hidden="true"></span>
      </a>
    </template>

    <script src="app.js" type="module"></script>
  </body>
</html>
